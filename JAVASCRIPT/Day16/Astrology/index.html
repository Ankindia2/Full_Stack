<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body style="background-color: rgb(44, 10, 36); color:rgb(9, 169, 121);display:flex; justify-content:center; align-items:center; height:100vh">
    <div class="container">
        <h1>Astrology Insights</h1>

        <form id="astroForm">
            <label for="name">First Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

             <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" required>
            <br><br>

             <label for="day">Date Of Birth(day):</label>
            <input type="number" id="day" name="day" min="1" max="31" required>
            <br><br>

             <label for="month">Month:</label>
            <input type="number" id="month" name="month" min="1" max="12" required>

            <br><br>

             <label for="year">Year:</label>
            <input type="number" id="year" name="year" min="1990" max="2026" required>
            <br><br>
            <input type="submit" value="Get Insights">
        </form>
        <div class="result" id="result"></div>
    </div>
</body>
<script src="./first.js"></script>
</html>
